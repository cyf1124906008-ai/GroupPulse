name: Independent desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform }} build and native tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: inputs
        with:
          path: |
            .build/downloads
            .build/codec-bin
          key: ${{ runner.os }}-independent-runtime-${{ hashFiles('runtime-inputs.json', 'scripts/build-codec.sh') }}
      - run: node --test tests/engine.test.cjs tests/integrity.test.cjs
      - run: python scripts/audit.py
      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows' && steps.inputs.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
      - run: bash scripts/build-codec.sh windows
        if: matrix.platform == 'windows' && steps.inputs.outputs.cache-hit != 'true'
        shell: msys2 {0}
      - run: python scripts/build.py --platform ${{ matrix.platform }}
      - run: python scripts/run-native-tests.py --platform ${{ matrix.platform }}
      - run: python scripts/package.py --platform ${{ matrix.platform }}
        if: hashFiles('docs/screenshots/overview-zh.png') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GroupPulse-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/${{ matrix.platform }}/native-test.json
            dist/${{ matrix.platform }}/build-report.json
          if-no-files-found: warn
